  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- bubbles -->
  <circle cx="990" cy="52" r="30" fill="#ffffff" opacity="0.08"/>
  <circle cx="1120" cy="90" r="12" fill="#ffffff" opacity="0.12"/>
  <circle cx="1060" cy="205" r="16" fill="#ffffff" opacity="0.10"/>
